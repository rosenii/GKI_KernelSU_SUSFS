name: 自动发布

permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions
  
on:
  push:
    branches:
      - dev   # 只在 dev 分支有 push 时触发
  pull_request:
    branches:
      - dev   # 可选，如果你也想在 PR 时触发
  schedule:
   - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true
      kernelsu_variant:
        # description: "选择 KernelSU | 注意:选中MKSU时为标准版"
        description: "选择 KernelSU"
        required: true
        type: choice
        options:
          - Official
          - Next
          - MKSU
          - SukiSU
        default: SukiSU
      kernelsu_branch:
        description: "选择 ksu 分支"
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Other(其他/指定)
        default: Stable(标准)
      # kernelsu_branch_other:
      #   description: "如果选择了 “其他”，请指定您的自定义分支"
      #   required: false
      #   type: string  # This input is required if 'Other' is chosen
      version:
        description: '自定义版本名(如5.10.198后面的字符/留空则使用默认版本号)'
        required: false
        type: string
      use_zram:
        description: '是否开启增加更多ZRAM算法?'
        required: true
        type: boolean
        default: true
      use_bbg:
        description: '是否开启BBG防格机补丁?'
        required: true
        type: boolean
        default: true
      use_kpm:
        description: '是否开启KPM功能?'
        required: true
        type: boolean
        default: false
      get_manager:
        description: '是否同时获取最新KSU管理器?'
        required: true
        type: boolean
        default: true
      onlyAk3:
        description: '仅上传AK3压缩包?(无boot,下载更快)'
        required: true
        type: boolean
        default: true
jobs:
  get_manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant:  ${{ inputs.kernelsu_variant  }}

  build-kernel-a12-5-10:
    uses: ./.github/workflows/kernel-a12-5.10.yml
    secrets: inherit
    with:
      make_release: true
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      # # kernelsu_branch_other: ${{ inputs.kernelsu_branch_other }}
      version: ${{ inputs.version }}
      use_zram: ${{ inputs.use_zram }}
      use_kpm: ${{ inputs.use_kpm }}
      use_bbg: ${{ inputs.use_bbg }}
      onlyAk3: ${{ inputs.onlyAk3 || false }}
  trigger-release:
   runs-on: ubuntu-latest
   permissions:
    contents: write
    actions: write
   needs:
    - get_manager
    - build-kernel-a12-5-10
   if: ${{ inputs.make_release }}
   env:
    REPO_OWNER: rosenii
    REPO_NAME: GKI_KernelSU_SUSFS
    SUS_VERSION: ''
    GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
    RELEASE_NAME: "GKI内核: ${{ inputs.kernelsu_variant == 'Next' && 'KernelSU-' || '' }}${{ inputs.kernelsu_variant }}(${{ needs.get_manager.outputs.ksuVer }}) & SUSFS ${{ needs.get_manager.outputs.susVer }}"
    RELEASE_NOTES: |
      此处包含：**${{ inputs.kernelsu_variant == 'Next' && 'KernelSU-' || '' }}${{ inputs.kernelsu_variant }}**、SUSFS ${{ needs.get_manager.outputs.susVer }} ${{ inputs.use_zram && '、LZ4KD' || '' }}

      功能:
      -> ${{ inputs.kernelsu_variant == 'Next' && 'KernelSU-' || '' }}${{ inputs.kernelsu_variant }}${{ inputs.kernelsu_variant == 'Official' && '原版' || '' }}${{ inputs.kernelsu_branch == 'Dev(开发)' && format('({0})', needs.get_manager.outputs.ksuVer) || '稳定版' }}
      -> SUSFS ඞ ${{ needs.get_manager.outputs.susVer }}
      -> ${{ (inputs.kernelsu_variant == 'Official' || inputs.kernelsu_variant == 'MKSU') && 'Kprobes Hook + SUSFS_SUS_SU' || 'VFS Hooks v1.6' }}
      ${{ inputs.kernelsu_variant != 'Official' && '-> Magic Mount 支持' || '-> OVERLAYFS 支持' }}
      -> BBG安全补丁 ${{ inputs.use_bbg && '支持' || '不支持' }}
      ${{ inputs.use_kpm && '-> KPM 支持' || '' }}
      -> **LZ4KD&ONEPLUS_LZ4K**  ${{ inputs.use_zram && '开启' || '未开启' }}
      -> lz4: v1.10.0 ${{ inputs.use_zram && '开启' || '未开启' }}
      
      模块: 
      -> https://github.com/sidex15/ksu_module_susfs

   steps:
    # Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # （略去前面分支/版本/RELEASE_NOTES生成逻辑，保持你原来的内容）

    # 下载构建产物（不自动解压）
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./downloaded-artifacts
        skip-decompression: true

    # 获取最新 Tag 并创建新 Tag
    - name: 生成和创建新标签
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        SUS_VERSION=${{ needs.get_manager.outputs.susVer }}
        LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' | sed 's/-.*//')
        if [ "$SUS_VERSION" = "$LATEST_TAG" ]; then
          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name')
        else
          LATEST_TAG="$SUS_VERSION-r0"
        fi
        NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')
        echo "New tag: $NEW_TAG"
        echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

        # 创建 tag
        gh api \
          -H "Accept: application/vnd.github+json" \
          -X POST /repos/$REPO_OWNER/$REPO_NAME/git/refs \
          -f ref="refs/tags/${NEW_TAG}" \
          -f sha="$(git rev-parse HEAD)"

    # 创建 GitHub Release
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      uses: actions/create-release@v1
      with:
        tag_name: ${{ env.NEW_TAG }}
        prerelease: true
        release_name: ${{ env.RELEASE_NAME }}
        body: ${{ env.RELEASE_NOTES }}

    # 上传所有 .zip 构建产物
    - name: Upload All .zip Artifacts
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        shopt -s nullglob
        echo "准备上传构建产物 (.zip 文件)..."
        for dir in ./downloaded-artifacts/*; do
          if [ -d "$dir" ]; then
            for file in "$dir"/*.zip; do
              [ -e "$file" ] || continue
              echo "Uploading $file..."
              gh release upload "${NEW_TAG}" "$file" --clobber
            done
          elif [ -f "$dir" ] && [[ "$dir" == *.zip ]]; then
            echo "Uploading $dir..."
            gh release upload "${NEW_TAG}" "$dir" --clobber
          fi
        done

    # 显示已上传的 .zip 文件
    - name: Display Uploaded .zip Files
      run: |
        echo "GitHub release 已上传以下 .zip 文件:"
        for dir in ./downloaded-artifacts/*; do
          if [ -d "$dir" ]; then
            ls "$dir"/*.zip 2>/dev/null
          elif [ -f "$dir" ] && [[ "$dir" == *.zip ]]; then
            echo "$dir"
          fi
        done
