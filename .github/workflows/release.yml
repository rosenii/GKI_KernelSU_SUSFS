name: Pre-Release

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: '23 4 * * *'

  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "选择 KernelSU"
        required: true
        type: choice
        options:
          - Official
          - Next
          - MKSU
          - SukiSU
        default: SukiSU

      kernelsu_branch:
        description: "选择 KSU 分支"
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
        default: Dev(开发)

      make_release:
        description: "是否创建 Release？"
        required: true
        type: boolean
        default: true

      get_manager:
        description: "是否构建管理器？"
        required: true
        type: boolean
        default: true


jobs:
  # 全局默认值（schedule 触发时使用）
  prepare-inputs:
    runs-on: ubuntu-latest
    outputs:
      kernelsu_variant: ${{ steps.set.outputs.kernelsu_variant }}
      kernelsu_branch:  ${{ steps.set.outputs.kernelsu_branch }}
      make_release:     ${{ steps.set.outputs.make_release }}
      get_manager:      ${{ steps.set.outputs.get_manager }}
    steps:
      - id: set
        run: |
          # 当通过 workflow_dispatch 触发时 inputs.* 有值
          # 当 schedule 触发时 inputs.* = '' → 使用默认值
          echo "kernelsu_variant=${{ inputs.kernelsu_variant != '' && inputs.kernelsu_variant || 'SukiSU' }}" >> $GITHUB_OUTPUT
          echo "kernelsu_branch=${{ inputs.kernelsu_branch != '' && inputs.kernelsu_branch || 'Dev(开发)' }}" >> $GITHUB_OUTPUT
          echo "make_release=${{ inputs.make_release != '' && inputs.make_release || 'true' }}" >> $GITHUB_OUTPUT
          echo "get_manager=${{ inputs.get_manager != '' && inputs.get_manager || 'true' }}" >> $GITHUB_OUTPUT


  # 管理器构建
  get_manager:
    needs: prepare-inputs
    if: ${{ needs.prepare-inputs.outputs.get_manager == 'true' }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ needs.prepare-inputs.outputs.kernelsu_variant }}


  # 内核构建
  build-kernel:
    needs: prepare-inputs
    uses: ./.github/workflows/kernel-a12-5.10.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ needs.prepare-inputs.outputs.kernelsu_variant }}
      kernelsu_branch:  ${{ needs.prepare-inputs.outputs.kernelsu_branch }}
      make_release: true


  # Release job
  release:
    needs:
      - prepare-inputs
      - get_manager
      - build-kernel
    if: ${{ needs.prepare-inputs.outputs.make_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v3

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          skip-decompression: true

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TAG="nightly-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" -t "$TAG" -n "自动构建 Release (${TAG})" --prerelease

      - name: 上传所有产物
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          shopt -s nullglob
          for file in ./artifacts/**/*; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              gh release upload "$TAG" "$file" --clobber
            fi
          done
