name: Pre-Release

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true

      kernelsu_variant:
        description: "选择 KernelSU"
        required: true
        type: choice
        options:
          - Official
          - Next
          - MKSU
          - SukiSU
        default: SukiSU

      kernelsu_branch:
        description: "选择 ksu 分支"
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Other(其他/指定)
        default: Stable(标准)

      version:
        description: '自定义版本名'
        required: false
        type: string

      use_zram:
        description: '是否开启增加更多ZRAM算法?'
        required: true
        type: boolean
        default: true

      use_bbg:
        description: '是否开启BBG防格机补丁?'
        required: true
        type: boolean
        default: true

      use_kpm:
        description: '是否开启KPM功能?'
        required: true
        type: boolean
        default: false

      get_manager:
        description: '是否同时获取最新KSU管理器?'
        required: true
        type: boolean
        default: true

      onlyAk3:
        description: '仅上传AK3压缩包?(无boot,下载更快)'
        required: true
        type: boolean
        default: true


jobs:

  # ----------------------------------------------------------
  # 统一输入：如果是 schedule，则自动套用默认值
  # ----------------------------------------------------------
  set-default-inputs:
    runs-on: ubuntu-latest
    outputs:
      make_release: ${{ steps.out.outputs.make_release }}
      kernelsu_variant: ${{ steps.out.outputs.kernelsu_variant }}
      kernelsu_branch: ${{ steps.out.outputs.kernelsu_branch }}
      version: ${{ steps.out.outputs.version }}
      use_zram: ${{ steps.out.outputs.use_zram }}
      use_bbg: ${{ steps.out.outputs.use_bbg }}
      use_kpm: ${{ steps.out.outputs.use_kpm }}
      get_manager: ${{ steps.out.outputs.get_manager }}
      onlyAk3: ${{ steps.out.outputs.onlyAk3 }}
    steps:
      - id: out
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "make_release=true" >> $GITHUB_OUTPUT
            echo "kernelsu_variant=SukiSU" >> $GITHUB_OUTPUT
            echo "kernelsu_branch=Dev(开发)" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT
            echo "use_zram=true" >> $GITHUB_OUTPUT
            echo "use_bbg=true" >> $GITHUB_OUTPUT
            echo "use_kpm=false" >> $GITHUB_OUTPUT
            echo "get_manager=true" >> $GITHUB_OUTPUT
            echo "onlyAk3=true" >> $GITHUB_OUTPUT
          else
            # 直接输出用户输入值
            echo "make_release=${{ inputs.make_release }}" >> $GITHUB_OUTPUT
            echo "kernelsu_variant=${{ inputs.kernelsu_variant }}" >> $GITHUB_OUTPUT
            echo "kernelsu_branch=${{ inputs.kernelsu_branch }}" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "use_zram=${{ inputs.use_zram }}" >> $GITHUB_OUTPUT
            echo "use_bbg=${{ inputs.use_bbg }}" >> $GITHUB_OUTPUT
            echo "use_kpm=${{ inputs.use_kpm }}" >> $GITHUB_OUTPUT
            echo "get_manager=${{ inputs.get_manager }}" >> $GITHUB_OUTPUT
            echo "onlyAk3=${{ inputs.onlyAk3 }}" >> $GITHUB_OUTPUT
          fi


  # ----------------------------------------------------------
  # Manager 构建
  # ----------------------------------------------------------
  get_manager:
    needs: set-default-inputs
    if: ${{ needs.set-default-inputs.outputs.get_manager == 'true' }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ needs.set-default-inputs.outputs.kernelsu_variant }}

  # ----------------------------------------------------------
  # Kernel 构建
  # ----------------------------------------------------------
  build-kernel-a12-5-10:
    needs: set-default-inputs
    uses: ./.github/workflows/kernel-a12-5.10.yml
    secrets: inherit
    with:
      make_release: true
      kernelsu_variant: ${{ needs.set-default-inputs.outputs.kernelsu_variant }}
      kernelsu_branch: ${{ needs.set-default-inputs.outputs.kernelsu_branch }}
      version: ${{ needs.set-default-inputs.outputs.version }}
      use_zram: ${{ needs.set-default-inputs.outputs.use_zram }}
      use_kpm: ${{ needs.set-default-inputs.outputs.use_kpm }}
      use_bbg: ${{ needs.set-default-inputs.outputs.use_bbg }}
      onlyAk3: ${{ needs.set-default-inputs.outputs.onlyAk3 }}

  # ----------------------------------------------------------
  # Release Job：合并所有产物并发布 Release
  # ----------------------------------------------------------
  trigger-release:
    runs-on: ubuntu-latest
    needs:
      - set-default-inputs
      - get_manager
      - build-kernel-a12-5-10
    if: ${{ needs.set-default-inputs.outputs.make_release == 'true' }}
    steps:

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          skip-decompression: true

      - name: Show artifacts
        run: |
          echo "所有将上传的文件："
          find ./artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}
          name: 自动构建 ${{ github.run_number }}
          files: ./artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
