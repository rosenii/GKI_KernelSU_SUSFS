name: GetManager
permissions:
  contents: write
  actions: read

on:
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}
      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    outputs:
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      susVer: ${{ steps.get_version.outputs.sversion }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 🧐 Debug Workflow Caller Context
        run: |
          echo "==================== DEBUG CONTEXT ===================="
          echo "EVENT NAME: ${{ github.event_name }}"
          echo "Caller Repository: ${{ github.caller_repository }}"
          echo "Caller Workflow:   ${{ github.caller_workflow }}"
          echo "Caller User:       ${{ github.triggering_actor }}"
          echo "Current Workflow:  ${{ github.workflow }}"
          echo "Current Job ID:    ${{ github.job }}"
          echo "Current Run ID:    ${{ github.run_id }}"
          echo "Git Ref:           ${{ github.ref }} (${ { github.ref_type } })"
          echo "======================================================="

      - name: 安装依赖
        run: sudo apt update && sudo apt install -y git curl jq unzip

      - name: 获取 KSU & SUSFS 版本
        id: get_version
        run: |
          # 克隆指定变体仓库
          VARIANT="${{ inputs.kernelsu_variant }}"
          case "$VARIANT" in
            Next)
              REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"
              ;;
            SukiSU)
              REPO_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
              ;;
            Official)
              REPO_URL="https://github.com/tiann/KernelSU.git"
              ;;
            MKSU)
              REPO_URL="https://github.com/5ec1cff/KernelSU.git"
              ;;
            *)
              echo "Unknown variant: $VARIANT"
              exit 1
              ;;
          esac

          git clone --quiet "$REPO_URL" KernelSU
          cd KernelSU

          # 计算 KSU 版本号
          GIT_COUNT=$(git rev-list --count HEAD)
          KSU_VERSION=$((10000 + GIT_COUNT + ( [ "$VARIANT" = "SukiSU" ] && echo 700 || echo 200 )))
          [ "$VARIANT" = "SukiSU" ] && KSU_VERSION=$((40000 + GIT_COUNT - 2815))
          [ "$VARIANT" = "Official" ] && KSU_VERSION=$((20000 + GIT_COUNT))
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # 获取 SUSFS 版本号
          SUS_URL="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop?ref_type=heads"
          SUS_VERSION=$(curl -s "$SUS_URL" | awk -F '=' '$1=="version"{print $2}')
          echo "SUSFS_VERSION=$SUS_VERSION" >> $GITHUB_ENV

          # 输出给 workflow
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

      - name: 下载 KernelSU Manager
        id: add_KSU
        continue-on-error: true
        run: |
          VARIANT="${{ inputs.kernelsu_variant }}"
          case "$VARIANT" in
            Next) REPO="KernelSU-Next/KernelSU-Next"; WORKFLOW="build-manager-ci.yml"; ;;
            SukiSU) REPO="SukiSU-Ultra/SukiSU-Ultra"; WORKFLOW="build-manager.yml"; ;;
            MKSU) REPO="5ec1cff/KernelSU"; WORKFLOW="build-manager.yml"; ;;
            Official) REPO="tiann/KernelSU"; WORKFLOW="build-manager.yml"; ;;
          esac

          echo "Fetching latest successful build for $VARIANT..."
          LATEST_RUN_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW/runs?status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id')

          echo "Latest Run ID: $LATEST_RUN_ID"

          ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/actions/runs/$LATEST_RUN_ID/artifacts")

          # 通用大小写匹配 Manager
          ARTIFACT_NAME=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | ascii_downcase | contains("manager")) | .name')
          ARTIFACT_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | ascii_downcase | contains("manager")) | .archive_download_url')

          if [ -z "$ARTIFACT_URL" ]; then
            echo "未找到 Manager artifact!"
            exit 1
          fi

          TARGET_FILE="$VARIANT-Manager(${{ env.KSU_VERSION }}).zip"
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$TARGET_FILE" "$ARTIFACT_URL"
          echo "Manager 文件已下载: $TARGET_FILE"
          unzip -q "$TARGET_FILE" -d manager && rm -f "$TARGET_FILE"

      - name: 下载 SUSFS 模块
        id: add_SUSFS
        continue-on-error: true
        run: |
          BUILD_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/workflows/build.yml/runs?status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id')

          ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$BUILD_ID/artifacts")

          ARTIFACT_NAME=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].name')
          ARTIFACT_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].archive_download_url')
          TARGET_FILE="susfs-$ARTIFACT_NAME.zip"

          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$TARGET_FILE" "$ARTIFACT_URL"
          mkdir -p susfs-module && unzip -q "$TARGET_FILE" -d susfs-module && rm -f "$TARGET_FILE"
          echo "SUSFS 模块已下载: $TARGET_FILE"

      - name: 上传 KernelSU Manager
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager(${{ env.KSU_VERSION }})
          path: manager/*

      - name: 上传 SUSFS 模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: susfs-module/*
